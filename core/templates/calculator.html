{% extends 'base.html' %}{% block title %}Smart Calculator • SmartLife{% endblock %}{% block extra_head %}<style>.calc{max-width:430px;margin:auto}.display{font-size:38px;font-weight:900;text-align:right;padding:20px;background:#0f172a;color:#fff;border-radius:20px;margin-bottom:14px;min-height:88px;overflow:auto}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{border:0;border-radius:15px;padding:17px;font-size:20px;font-weight:850;background:#f1f5f9}.key:hover{transform:translateY(-1px)}.key.op{background:#eef2ff;color:#4338ca}.key.equal{grid-row:span 2;background:#6366f1;color:white}.key.zero{grid-column:span 2}</style>{% endblock %}{% block content %}<div class="calc"><div class="page-head"><div><h1>🧮 Smart Calculator</h1><p>Tez hisob-kitob uchun.</p></div><a class="btn btn-soft" href="{% url 'games' %}">← O‘yinlar</a></div><div class="card" style="padding:18px"><div id="display" class="display">0</div><div class="keys"><button class="key" onclick="clearCalc()">AC</button><button class="key" onclick="backspace()">⌫</button><button class="key op" onclick="press('%')">%</button><button class="key op" onclick="press('/')">÷</button><button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button><button class="key op" onclick="press('*')">×</button><button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button><button class="key op" onclick="press('-')">−</button><button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button><button class="key op" onclick="press('+')">+</button><button class="key zero" onclick="press('0')">0</button><button class="key" onclick="press('.')">.</button><button class="key equal" onclick="calculate()">=</button></div></div></div><script>let expr='';const d=document.getElementById('display');function render(){d.textContent=expr||'0'}function press(x){if(expr.length<35)expr+=x;render()}function clearCalc(){expr='';render()}function backspace(){expr=expr.slice(0,-1);render()}function calculate(){if(!expr)return;try{let safe=expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/%/g,'/100');if(!/^[0-9+\-*/.()\s]+$/.test(safe))throw Error();let v=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(v))throw Error();expr=String(Math.round(v*1e10)/1e10);render()}catch(e){d.textContent='Xato';setTimeout(clearCalc,900)}}document.addEventListener('keydown',e=>{if(/[0-9.+\-*/%]/.test(e.key))press(e.key);if(e.key==='Enter')calculate();if(e.key==='Backspace')backspace();if(e.key==='Escape')clearCalc()});</script>{% endblock %}
