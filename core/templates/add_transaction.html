{% extends "base.html" %}{% block title %}SmartLife — Operatsiya qo‘shish{% endblock %}{% block content %}<div style="max-width:650px;margin:auto"><div class="page-head"><div><h1>💳 Operatsiya qo‘shish</h1><p>Daromad yoki xarajatni kiriting.</p></div></div><div class="card" style="padding:28px">{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="form-group"><label>Nomi</label><input class="input" name="title" placeholder="Masalan: Oylik maosh" required></div><div class="form-group"><label>Summa</label><input class="input" type="number" step="0.01" min="0.01" name="amount" placeholder="0" required></div><div class="form-group"><label>Kategoriya</label><input class="input" name="category" placeholder="Oziq-ovqat, transport, maosh..." required></div><div class="form-group"><label>Turi</label><select class="input" name="type"><option value="income">📈 Daromad</option><option value="expense">📉 Xarajat</option></select></div><div style="display:flex;gap:10px"><a class="btn" style="background:#f1f5f9" href="{% url 'transactions' %}">Orqaga</a><button class="btn btn-primary" type="submit">💾 Saqlash</button></div></form></div></div>{% endblock %}
